<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17171c"/>
      <stop offset="1" stop-color="#070709"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b5e"/>
      <stop offset="1" stop-color="#e03131"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect width="64" height="64" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- kasagi: top beam with upward curve -->
  <path d="M8 27 Q32 16 56 27 L56 35 Q32 24 8 35 Z" fill="url(#gate)"/>

  <!-- nuki: lower beam -->
  <rect x="10" y="38" width="44" height="7" rx="3.5" fill="url(#gate)"/>

  <!-- pillars -->
  <rect x="15" y="41" width="6" height="20" rx="3" fill="url(#gate)"/>
  <rect x="43" y="41" width="6" height="20" rx="3" fill="url(#gate)"/>

  <!-- sun disc -->
  <circle cx="32" cy="19.5" r="3.6" fill="#ffffff" fill-opacity="0.92"/>
</svg>
